        <div style="font-size:0.82rem;color:var(--muted);text-align:center;margin-bottom:20px;line-height:1.5;">
          Add multiple wins to one player at once.<br>
          Great for catching up on historical scores.
        </div>

        <div class="field-label">Player</div>
        <div class="winner-grid" id="bulkWinnerGrid">
          ${state.players.map(p => `
            <button class="winner-chip ${p.id === bulkWinnerId ? 'selected' : ''}" data-winner="${p.id}"
              style="--chip-color:${p.color};--chip-bg:${hexToRgba(p.color, 0.12)};--chip-glow:${hexToRgba(p.color, 0.5)}">
              <span class="wc-dot"></span>
              <span>${escapeHtml(p.name)}</span>
            </button>
          `).join('')}
        </div>

        <div class="field-label">Number of wins</div>
        <div class="bulk-count-row">
          <button class="bulk-btn" id="bulkMinus">${ICONS.minus}</button>
          <input type="number" class="bulk-count-input" id="bulkCount" value="${bulkCount}" min="1" max="999" inputmode="numeric" />
          <button class="bulk-btn" id="bulkPlus">${ICONS.plus}</button>
        </div>
        <div class="bulk-count-label">Wins to add</div>

        <div class="field-label">Date</div>
        <div class="date-row">
          <input type="date" class="date-input" id="bulkDateInput" value="${bulkDate}" />
          <button class="today-btn" id="bulkTodayBtn">Today</button>
        </div>

        <div class="sheet-actions">
          <button class="sheet-btn primary full" id="bulkAddBtn" ${bulkWinnerId ? '' : 'disabled'}>
            Add ${bulkCount} Win${bulkCount === 1 ? '' : 's'}
          </button>
        </div>
      `;

      const grid = document.getElementById('bulkWinnerGrid');
      const countInput = document.getElementById('bulkCount');
      const minusBtn = document.getElementById('bulkMinus');
      const plusBtn = document.getElementById('bulkPlus');
      const addBtn = document.getElementById('bulkAddBtn');
      const dateInput = document.getElementById('bulkDateInput');

      function refresh() {
        countInput.value = bulkCount;
        addBtn.textContent = `Add ${bulkCount} Win${bulkCount === 1 ? '' : 's'}`;
        addBtn.disabled = !bulkWinnerId;
      }

      grid.querySelectorAll('[data-winner]').forEach(btn => {
        btn.onclick = () => {
          bulkWinnerId = btn.dataset.winner;
          grid.querySelectorAll('.winner-chip').forEach(b => b.classList.toggle('selected', b === btn));
          refresh();
        };
      });

      minusBtn.onclick = () => { bulkCount = Math.max(1, bulkCount - 1); refresh(); };
      plusBtn.onclick = () => { bulkCount = Math.min(999, bulkCount + 1); refresh(); };

      countInput.oninput = () => {
        const v = parseInt(countInput.value) || 1;
        bulkCount = Math.max(1, Math.min(999, v));
        refresh();
      };
      countInput.onblur = () => { countInput.value = bulkCount; };

      dateInput.oninput = () => { bulkDate = dateInput.value; };
      document.getElementById('bulkTodayBtn').onclick = () => {
        bulkDate = todayISO();
        dateInput.value = bulkDate;
      };

      addBtn.onclick = () => {
        if (!bulkWinnerId) return;
        const newGames = [];
        for (let i = 0; i < bulkCount; i++) {
          newGames.push({
            id: uid(),
            winnerId: bulkWinnerId,
            board: null,
            date: bulkDate || '',
            ts: Date.now() + i,
            bulk: true
          });
        }
        state.games.push(...newGames);
        state.lastWinnerId = bulkWinnerId;
        save();
        closeSheet();
        render();
        const p = playerById(bulkWinnerId);
        if (p) fireConfetti(p.color, 60);
        toast(`${bulkCount} win${bulkCount === 1 ? '' : 's'} added for ${p.name}`, {
          duration: 4500,
          undo: () => {
            const ids = new Set(newGames.map(g => g.id));
            state.games = state.games.filter(x => !ids.has(x.id));
            save();
            render();
            toast('Bulk add undone');
          }
        });
      };

      refresh();
    }

    function switchTab(tab) {
      document.querySelectorAll('.sheet-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
      });
      if (tab === 'single') renderSingleTab();
      else renderBulkTab();
    }

    document.querySelectorAll('.sheet-tab').forEach(t => {
      t.onclick = () => switchTab(t.dataset.tab);
    });

    if (initialTab === 'bulk') renderBulkTab();
    else renderSingleTab();
  });
}

/* ============================================================
   HISTORY VIEW
   ============================================================ */
function renderHistory() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const header = el('div', 'view-header');
  header.innerHTML = `
    <button class="view-back" id="backBtn" aria-label="Back">${ICONS.back}</button>
    <div class="view-title">All Games</div>
    <div class="view-spacer"></div>
  `;
  app.appendChild(header);
  header.querySelector('#backBtn').onclick = () => { state.view = 'home'; render(); };

  if (state.games.length === 0) {
    const empty = el('div', 'empty-state');
    empty.textContent = 'No games logged yet.';
    app.appendChild(empty);
    return;
  }

  const filterRow = el('div', 'filter-row');
  const allChip = el('button', 'filter-chip' + (state.historyFilter === 'all' ? ' active' : ''));
  allChip.innerHTML = `All (${state.games.length})`;
  allChip.onclick = () => { state.historyFilter = 'all'; render(); };
  filterRow.appendChild(allChip);

  state.players.forEach(p => {
    const count = trackedWins(p.id);
    const chip = el('button', 'filter-chip' + (state.historyFilter === p.id ? ' active color-mode' : ''));
    chip.style.setProperty('--chip-color', p.color);
    chip.style.setProperty('--chip-bg', hexToRgba(p.color, 0.12));
    chip.style.setProperty('--chip-border', hexToRgba(p.color, 0.4));
    chip.innerHTML = `<span class="chip-dot"></span>${escapeHtml(p.name)} (${count})`;
    chip.onclick = () => { state.historyFilter = p.id; render(); };
    filterRow.appendChild(chip);
  });
  app.appendChild(filterRow);

  let filtered = state.games;
  if (state.historyFilter !== 'all') {
    filtered = filtered.filter(g => g.winnerId === state.historyFilter);
  }

  if (filtered.length === 0) {
    const empty = el('div', 'empty-state');
    empty.textContent = 'No games match this filter.';
    app.appendChild(empty);
    return;
  }

  const sorted = [...filtered].sort((a, b) => {
    if (a.date && b.date && a.date !== b.date) return b.date.localeCompare(a.date);
    if (a.date && !b.date) return -1;
    if (!a.date && b.date) return 1;
    return (b.ts || 0) - (a.ts || 0);
  });

  const list = el('div', 'history-list');
  sorted.forEach(g => list.appendChild(renderGameRow(g, true)));
  app.appendChild(list);

  const wm = el('div', 'watermark');
  wm.innerHTML = `Made by <span>Leif</span>`;
  app.appendChild(wm);
}

function openEditGameSheet(gameId) {
  const g = state.games.find(x => x.id === gameId);
  if (!g) return;

  let winnerId = g.winnerId;
  let board = g.board;
  let date = g.date || '';

  const html = `
    <div class="sheet-handle"></div>
    <div class="sheet-title">Edit Game</div>
    <div class="sheet-sub">Changes affect stats immediately</div>

    <div class="field-label">Winner</div>
    <div class="winner-grid" id="winnerGrid">
      ${state.players.map(p => `
        <button class="winner-chip ${p.id === winnerId ? 'selected' : ''}" data-winner="${p.id}"
          style="--chip-color:${p.color};--chip-bg:${hexToRgba(p.color, 0.12)};--chip-glow:${hexToRgba(p.color, 0.5)}">
          <span class="wc-dot"></span>
          <span>${escapeHtml(p.name)}</span>
        </button>
      `).join('')}
    </div>

    <div class="field-label">Board</div>
    <div class="board-list" id="boardList">
      <button class="board-chip ${!board ? 'selected' : ''}" data-board="">— No board —</button>
      ${state.boards.map(b => `
        <button class="board-chip ${b === board ? 'selected' : ''}" data-board="${escapeHtml(b)}">${escapeHtml(b)}</button>
      `).join('')}
    </div>

    <div class="field-label">Date</div>
    <div class="date-row">
      <input type="date" class="date-input" id="dateInput" value="${date}" />
      <button class="today-btn" id="todayBtn">Today</button>
    </div>

    <div class="sheet-actions">
      <button class="sheet-btn secondary" id="deleteBtn" style="color:var(--danger);border-color:rgba(248,113,113,0.25);">Delete</button>
      <button class="sheet-btn primary" id="saveBtn">Save</button>
    </div>
  `;

  openSheet(html, () => {
    const grid = document.getElementById('winnerGrid');
    const boardList = document.getElementById('boardList');
    const dateInput = document.getElementById('dateInput');

    grid.querySelectorAll('[data-winner]').forEach(btn => {
      btn.onclick = () => {
        winnerId = btn.dataset.winner;
        grid.querySelectorAll('.winner-chip').forEach(b => b.classList.toggle('selected', b === btn));
      };
    });
    boardList.querySelectorAll('[data-board]').forEach(btn => {
      btn.onclick = () => {
        board = btn.dataset.board || null;
        boardList.querySelectorAll('.board-chip').forEach(b => b.classList.toggle('selected', b === btn));
      };
    });
    dateInput.oninput = () => { date = dateInput.value; };
    document.getElementById('todayBtn').onclick = () => {
      date = todayISO();
      dateInput.value = date;
    };
    document.getElementById('deleteBtn').onclick = () => {
      if (!confirm('Delete this game? This cannot be undone.')) return;
      state.games = state.games.filter(x => x.id !== gameId);
      save();
      closeSheet();
      render();
      toast('Game deleted');
    };
    document.getElementById('saveBtn').onclick = () => {
      g.winnerId = winnerId;
      g.board = board;
      g.date = date;
      save();
      closeSheet();
      render();
      toast('Game updated');
    };
  });
}

/* ============================================================
   STATS VIEW
   ============================================================ */
function renderStats() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const header = el('div', 'view-header');
  header.innerHTML = `
    <button class="view-back" id="backBtn" aria-label="Back">${ICONS.back}</button>
    <div class="view-title">Statistics</div>
    <div class="view-spacer"></div>
  `;
  app.appendChild(header);
  header.querySelector('#backBtn').onclick = () => { state.view = 'home'; render(); };

  const tabs = el('div', 'period-tabs');
  [['all', 'All Time'], ['30', '30 Days'], ['7', '7 Days']].forEach(([val, label]) => {
    const tab = el('button', 'period-tab' + (state.statsPeriod === val ? ' active' : ''), label);
    tab.onclick = () => { state.statsPeriod = val; render(); };
    tabs.appendChild(tab);
  });
  app.appendChild(tabs);

  const subset = filterByPeriod(state.games, state.statsPeriod);
  const { ranking, winsByBoard, totalGames } = computeStats(subset);
  const streaks = computeStreaks(subset);
  const activity = computeActivity(14);
  const weekdayWins = computeWeekdayWins();

  const boardEntries = Object.entries(winsByBoard).filter(([_, v]) => v.plays > 0);
  const mostPlayedBoard = boardEntries.length
    ? boardEntries.slice().sort((a, b) => b[1].plays - a[1].plays)[0]
    : null;

  // Overview
  const overview = el('div', 'stats-overview');
  overview.innerHTML = `
    <div class="stat-card">
      <div class="stat-value">${totalGames}</div>
      <div class="stat-label">Games Logged</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${boardEntries.length}</div>
      <div class="stat-label">Boards Played</div>
    </div>
    <div class="stat-card wide">
      <div class="stat-value">${mostPlayedBoard ? escapeHtml(mostPlayedBoard[0]) : '—'}</div>
      <div class="stat-label">${mostPlayedBoard ? `Most Played · ${mostPlayedBoard[1].plays}×` : 'No boards played yet'}</div>
    </div>
  `;
  app.appendChild(overview);

  // 14-day activity chart
  const activitySection = el('div', 'stat-section');
  const activityHead = el('div', 'section-header');
  activityHead.style.margin = '0 0 12px';
  activityHead.innerHTML = `
    <div class="section-label">Activity · Last 14 Days</div>
    <div class="section-meta">Games played</div>
  `;
  activitySection.appendChild(activityHead);

  const activityChart = el('div', 'activity-chart');
  const maxActivity = Math.max(1, ...activity.map(a => a.count));
  const totalLast14 = activity.reduce((a, b) => a + b.count, 0);
  const activeDays = activity.filter(a => a.count > 0).length;
  const todayKey = todayISO();

  activityChart.innerHTML = `
    <div class="activity-bars" id="activityBars">
      ${activity.map(a => {
        const pct = a.count === 0 ? 0 : Math.max(8, (a.count / maxActivity) * 100);
        const isToday = a.key === todayKey;
        return `
          <div class="activity-bar-col">
            <div class="activity-bar-count ${a.count === 0 ? 'zero' : ''}">${a.count}</div>
            <div class="activity-bar ${a.count === 0 ? 'empty' : ''} ${isToday ? 'today' : ''}"
              style="height:${pct}%"></div>
          </div>
        `;
      }).join('')}
    </div>
    <div class="activity-labels">
      ${activity.map(a => {
        const isToday = a.key === todayKey;
        const day = a.date.getDate();
        return `<div class="activity-label ${isToday ? 'today' : ''}">${day}</div>`;
      }).join('')}
    </div>
    <div class="activity-summary">
      <div>
        <span class="activity-summary-label">Total</span>
        <span class="activity-summary-value">${totalLast14}</span>
      </div>
      <div>
        <span class="activity-summary-label">Active Days</span>
        <span class="activity-summary-value">${activeDays}/14</span>
      </div>
      <div>
        <span class="activity-summary-label">Peak Day</span>
        <span class="activity-summary-value">${maxActivity}</span>
      </div>
    </div>
  `;
  activitySection.appendChild(activityChart);
  app.appendChild(activitySection);

  // Wins by player with win rate
  const maxWins = Math.max(1, ...ranking.map(p => p.wins));
  const winsSection = el('div', 'stat-section');
  winsSection.innerHTML = `<div class="section-header" style="margin-bottom:12px;"><div class="section-label">Wins by Player</div></div>`;
  ranking.forEach(p => {
    const tracked = trackedWins(p.id);
    const rate = totalGames > 0 ? Math.round((tracked / totalGames) * 100) : 0;
    const row = el('div', 'stat-bar-row');
    applyColorVars(row, p.color);
    row.innerHTML = `
      <div class="stat-bar-head">
        <div class="stat-bar-name">
          <span class="stat-dot"></span>
          <span>${escapeHtml(p.name)}</span>
        </div>
        <div class="stat-bar-right">
          <span class="stat-bar-count">${p.wins}</span>
          <span class="stat-bar-rate">${rate}%</span>
        </div>
      </div>
      <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round((p.wins / maxWins) * 100)}%"></div></div>
    `;
    winsSection.appendChild(row);
  });
  app.appendChild(winsSection);

  // Streaks
  const curPlayer = streaks.current.playerId ? playerById(streaks.current.playerId) : null;
  const bestPlayer = streaks.best.playerId ? playerById(streaks.best.playerId) : null;
  const streakSection = el('div', 'stat-section');
  streakSection.innerHTML = `
    <div class="section-header" style="margin-bottom:12px;"><div class="section-label">Streaks</div></div>
    <div class="streak-row">
      <div class="streak-info">
        <div class="streak-label">Current Streak</div>
        <div class="streak-value">
          ${curPlayer ? `<span class="stat-dot" style="background:${curPlayer.color}"></span>` : ''}
          <span>${curPlayer && streaks.current.streak > 1 ? escapeHtml(curPlayer.name) : 'No active streak'}</span>
        </div>
      </div>
      <div class="streak-num">${streaks.current.streak > 1 ? streaks.current.streak : '—'}</div>
    </div>
    <div class="streak-row">
      <div class="streak-info">
        <div class="streak-label">Best Streak</div>
        <div class="streak-value">
          ${bestPlayer ? `<span class="stat-dot" style="background:${bestPlayer.color}"></span>` : ''}
          <span>${bestPlayer ? escapeHtml(bestPlayer.name) : '—'}</span>
        </div>
      </div>
      <div class="streak-num">${streaks.best.streak > 1 ? streaks.best.streak : '—'}</div>
    </div>
  `;
  app.appendChild(streakSection);

  // Wins by weekday
  const weekdaySection = el('div', 'stat-section');
  weekdaySection.innerHTML = `<div class="section-header" style="margin-bottom:12px;"><div class="section-label">Wins by Weekday</div></div>`;
  const maxWeekday = Math.max(1, ...weekdayWins);
  const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  let bestDayIdx = 0;
  weekdayWins.forEach((v, i) => { if (v > weekdayWins[bestDayIdx]) bestDayIdx = i; });
  const weekdayChart = el('div', 'weekday-chart');
  weekdayChart.innerHTML = `
    <div class="weekday-bars">
      ${weekdayWins.map((v, i) => {
        const pct = v === 0 ? 0 : Math.max(4, (v / maxWeekday) * 100);
        return `
          <div class="weekday-col">
            <div class="weekday-bar-wrap">
              <div class="weekday-bar ${v === 0 ? 'empty' : ''}" style="height:${pct}%"></div>
            </div>
            <div class="weekday-label">${dayNames[i]}</div>
          </div>
        `;
      }).join('')}
    </div>
    <div class="weekday-best">
      ${weekdayWins[bestDayIdx] > 0
        ? `Most games played on <strong>${dayNames[bestDayIdx]}</strong> · ${weekdayWins[bestDayIdx]} game${weekdayWins[bestDayIdx] === 1 ? '' : 's'}`
        : 'No games logged yet'}
    </div>
  `;
  weekdaySection.appendChild(weekdayChart);
  app.appendChild(weekdaySection);

  // Best board per player
  const bestBoardsSection = el('div', 'stat-section');
  bestBoardsSection.innerHTML = `<div class="section-header" style="margin-bottom:12px;"><div class="section-label">Best Board Per Player</div></div>`;
  let hasBest = false;
  state.players.forEach(p => {
    const best = getBestBoardForPlayer(p.id);
    if (!best) return;
    hasBest = true;
    const row = el('div', 'board-stat-row');
    applyColorVars(row, p.color);
    row.innerHTML = `
      <div class="board-stat-dot"></div>
      <div style="flex:1;min-width:0;">
        <div class="board-stat-name" style="font-weight:700;">${escapeHtml(p.name)}</div>
        <div class="board-stat-sub">${escapeHtml(best.board)}</div>
      </div>
      <div class="board-stat-count">${best.wins}×</div>
    `;
    bestBoardsSection.appendChild(row);
  });
  if (hasBest) app.appendChild(bestBoardsSection);

  // Boards played
  if (boardEntries.length > 0) {
    const boardsSection = el('div', 'stat-section');
    boardsSection.innerHTML = `<div class="section-header" style="margin-bottom:12px;"><div class="section-label">Boards Played</div></div>`;
    boardEntries.sort((a, b) => b[1].plays - a[1].plays).forEach(([boardName, data]) => {
      const topWinnerId = Object.entries(data.winsByPlayer).sort((a, b) => b[1] - a[1])[0];
      const topWinner = topWinnerId ? playerById(topWinnerId[0]) : null;
      const row = el('div', 'board-stat-row');
      row.innerHTML = `
        <div style="flex:1;min-width:0;">
          <div class="board-stat-name">${escapeHtml(boardName)}</div>
          ${topWinner ? `<div class="board-stat-sub" style="display:flex;align-items:center;gap:6px;"><span class="stat-dot" style="width:8px;height:8px;background:${topWinner.color}"></span><span>${escapeHtml(topWinner.name)} leads · ${topWinnerId[1]} win${topWinnerId[1] === 1 ? '' : 's'}</span></div>` : ''}
        </div>
        <div class="board-stat-count">${data.plays}×</div>
      `;
      boardsSection.appendChild(row);
    });
    app.appendChild(boardsSection);
  }

  // Leaders / fun facts
  if (state.games.length > 0) {
    const factsSection = el('div', 'stat-section');
    factsSection.innerHTML = `<div class="section-header" style="margin-bottom:12px;"><div class="section-label">Fun Facts</div></div>`;

    // Longest gap between any two consecutive games
    const sorted = sortedByTime(state.games);
    let longestGapDays = 0;
    let gapStart = null, gapEnd = null;
    for (let i = 1; i < sorted.length; i++) {
      const prev = sorted[i - 1].date;
      const cur = sorted[i].date;
      if (!prev || !cur) continue;
      const [y1, m1, d1] = prev.split('-').map(Number);
      const [y2, m2, d2] = cur.split('-').map(Number);
      const diff = Math.round((new Date(y2, m2-1, d2) - new Date(y1, m1-1, d1)) / 86400000);
      if (diff > longestGapDays) { longestGapDays = diff; gapStart = prev; gapEnd = cur; }
    }

    // Most recent winner
    const lastWin = sorted[sorted.length - 1];
    const lastPlayer = playerById(lastWin.winnerId);

    // Longest current sitting without a win (tracked only)
    const sinceWin = {};
    state.players.forEach(p => sinceWin[p.id] = 0);
    for (let i = sorted.length - 1; i >= 0; i--) {
      const w = sorted[i].winnerId;
      state.players.forEach(p => {
        if (p.id !== w && sinceWin[p.id] === 0) sinceWin[p.id] = 0; // no-op, we want count after last win
      });
    }
    // Actually count games since last win, walking backward
    const gamesSince = {};
    state.players.forEach(p => gamesSince[p.id] = 0);
    const foundWin = {};
    state.players.forEach(p => foundWin[p.id] = false);
    for (let i = sorted.length - 1; i >= 0; i--) {
      const w = sorted[i].winnerId;
      state.players.forEach(p => {
        if (!foundWin[p.id]) {
          if (p.id === w) foundWin[p.id] = true;
          else gamesSince[p.id]++;
        }
      });
    }
    let driest = null;
    state.players.forEach(p => {
      if (!driest || gamesSince[p.id] > gamesSince[driest.id]) driest = p;
    });

    const facts = el('div', 'board-stat-list');

    if (lastPlayer) {
      const f = el('div', 'leader-note');
      f.innerHTML = `
        <div class="leader-note-label">Most Recent Win</div>
        <div class="leader-note-value">
          <span class="accent">${escapeHtml(lastPlayer.name)}</span> won on ${escapeHtml(fmtDate(lastWin.date) || 'an unrecorded date')}
        </div>
      `;
      facts.appendChild(f);
    }

    if (longestGapDays > 1) {
      const f = el('div', 'leader-note');
      f.innerHTML = `
        <div class="leader-note-label">Longest Break</div>
        <div class="leader-note-value">
          <span class="accent">${longestGapDays} days</span> between sessions (${escapeHtml(fmtDate(gapStart))} → ${escapeHtml(fmtDate(gapEnd))})
        </div>
      `;
      facts.appendChild(f);
    }

    if (driest && gamesSince[driest.id] >= 3) {
      const f = el('div', 'leader-note');
      f.innerHTML = `
        <div class="leader-note-label">Drought Watch</div>
        <div class="leader-note-value">
          <span class="accent">${escapeHtml(driest.name)}</span> hasn't won in the last <span class="accent">${gamesSince[driest.id]}</span> games
        </div>
      `;
      facts.appendChild(f);
    }

    // Biggest single-day session
    const byDay = {};
    state.games.forEach(g => { if (g.date) byDay[g.date] = (byDay[g.date] || 0) + 1; });
    const biggestDay = Object.entries(byDay).sort((a, b) => b[1] - a[1])[0];
    if (biggestDay && biggestDay[1] >= 3) {
      const f = el('div', 'leader-note');
      f.innerHTML = `
        <div class="leader-note-label">Biggest Session</div>
        <div class="leader-note-value">
          <span class="accent">${biggestDay[1]} games</span> played on ${escapeHtml(fmtDate(biggestDay[0]))}
        </div>
      `;
      facts.appendChild(f);
    }

    factsSection.appendChild(facts);
    app.appendChild(factsSection);
  }

  const wm = el('div', 'watermark');
  wm.innerHTML = `Made by <span>Leif</span>`;
  app.appendChild(wm);
}

/* ============================================================
   SETTINGS SHEET
   ============================================================ */
function openSettingsSheet() {
  const html = `
    <div class="sheet-handle"></div>
    <div class="sheet-title">Settings</div>
    <div class="sheet-sub">Names, colors, boards, and data</div>

    <div class="field-label">Characters</div>
    <div id="playersList"></div>

    <div style="height:8px"></div>

    <button class="menu-item" id="addBoardBtn">
      <span class="ico">${ICONS.map}</span> Manage boards
      <span class="right">${state.boards.length}</span>
    </button>

    <button class="menu-item" id="showWelcomeBtn">
      <span class="ico">${ICONS.star}</span> Show welcome screen
    </button>

    <div style="height:12px"></div>

    <button class="menu-item" id="exportBtn"><span class="ico">${ICONS.upload}</span> Export data</button>
    <button class="menu-item" id="importBtn"><span class="ico">${ICONS.download}</span> Import data</button>
    <button class="menu-item danger" id="resetBtn"><span class="ico">${ICONS.warning}</span> Reset all data</button>

    <div style="text-align:center;font-size:0.68rem;color:var(--dim);margin-top:14px;font-weight:700;letter-spacing:0.05em;">Party Tracker v2.4</div>
  `;

  openSheet(html, () => {
    const playersList = document.getElementById('playersList');

    state.players.forEach(p => {
      const block = document.createElement('div');
      block.className = 'player-block';
      applyColorVars(block, p.color);

      const head = document.createElement('div');
      head.className = 'player-head';
      head.innerHTML = `
        <div class="avatar-preview"></div>
        <input type="text" class="field-input" value="${escapeHtml(p.name)}" maxlength="24" data-player-input="${p.id}" />
      `;
      block.appendChild(head);

      const input = head.querySelector('.field-input');

      const colorRow = document.createElement('div');
      colorRow.className = 'player-block-row';
      const colorPicker = document.createElement('div');
      colorPicker.className = 'color-picker';
      COLOR_PALETTE.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'color-dot' + (c === p.color ? ' active' : '');
        btn.style.background = c;
        btn.setAttribute('aria-label', `Color ${c}`);
        btn.onclick = () => {
          p.color = c;
          save();
          colorPicker.querySelectorAll('.color-dot').forEach(b => b.classList.toggle('active', b === btn));
          applyColorVars(block, c);
        };
        colorPicker.appendChild(btn);
      });
      colorRow.appendChild(colorPicker);
      block.appendChild(colorRow);

      input.onchange = () => {
        const v = input.value.trim();
        if (v) { p.name = v; save(); }
        else { input.value = p.name; }
      };

      // Historical wins row
      const histRow = document.createElement('div');
      histRow.className = 'player-block-row';
      const tracked = trackedWins(p.id);
      const currentTotal = (p.baseWins || 0) + tracked;
      histRow.innerHTML = `
        <div class="historical-row">
          <div class="historical-label">
            Historical wins
            <span class="hint">Total on your paper sheet. Not counted in streaks.</span>
          </div>
          <input type="number" class="historical-input" min="0" max="9999" value="${currentTotal}" inputmode="numeric" data-historical-input="${p.id}" />
        </div>
      `;
      block.appendChild(histRow);

      const histInput = histRow.querySelector('[data-historical-input]');
      histInput.onchange = () => {
        const trk = trackedWins(p.id);
        const entered = Math.max(0, Math.min(9999, parseInt(histInput.value, 10) || 0));
        p.baseWins = Math.max(0, entered - trk);
        save();
        histInput.value = p.baseWins + trk;
        toast(`${p.name}: ${histInput.value} total wins`);
      };
      histInput.onblur = () => { histInput.value = p.baseWins + trackedWins(p.id); };

      playersList.appendChild(block);
    });

    document.getElementById('addBoardBtn').onclick = openBoardManager;
    document.getElementById('showWelcomeBtn').onclick = () => {
      closeSheet();
      showWelcome(true);
    };

    document.getElementById('exportBtn').onclick = () => {
      const data = JSON.stringify({
        players: state.players,
        boards: state.boards,
        games: state.games
      }, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `party-tracker-${todayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast('Data exported');
    };

    document.getElementById('importBtn').onclick = () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (!parsed || !Array.isArray(parsed.games)) throw new Error('bad');
            if (confirm(`Import ${parsed.games.length} games?\n\nThis will replace all current data.`)) {
              if (Array.isArray(parsed.players) && parsed.players.length === 5) {
                state.players = parsed.players.map((p, i) => ({
                  id: p.id || DEFAULT_PLAYERS[i].id,
                  name: p.name || DEFAULT_PLAYERS[i].name,
                  color: p.color || DEFAULT_PLAYERS[i].color,
                  baseWins: typeof p.baseWins === 'number' && p.baseWins >= 0 ? Math.floor(p.baseWins) : 0
                }));
              }
              if (Array.isArray(parsed.boards) && parsed.boards.length) state.boards = parsed.boards;
              state.games = parsed.games;
              save();
              closeSheet();
              render();
              toast('Data imported');
            }
          } catch {
            alert('That file does not look like a Party Tracker export.');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    };

    document.getElementById('resetBtn').onclick = () => {
      if (!confirm('Delete ALL games and reset to defaults?\n\nThis cannot be undone.')) return;
      if (!confirm('Are you absolutely sure? Every game and every win will be erased.')) return;
      state.players = DEFAULT_PLAYERS.map(p => ({ ...p }));
      state.boards = [...DEFAULT_BOARDS];
      state.games = [];
      state.queue = [];
      save();
      closeSheet();
      render();
      toast('All data reset');
    };
  });
}

function openBoardManager() {
  const html = `
    <div class="sheet-handle"></div>
    <div class="sheet-title">Boards</div>
    <div class="sheet-sub">Add, rename, or remove boards</div>

    <div id="boardList" style="margin-bottom:16px;"></div>

    <button class="sheet-btn primary full" id="addBoardBtn">+ Add Board</button>
    <div style="height:10px"></div>
    <button class="sheet-btn secondary full" id="backBtn">Back</button>
  `;

  openSheet(html, () => {
    const list = document.getElementById('boardList');

    function renderBoardList() {
      list.innerHTML = '';
      if (state.boards.length === 0) {
        list.innerHTML = '<div class="empty-state" style="margin-bottom:16px;">No boards yet.</div>';
        return;
      }
      state.boards.forEach((b, idx) => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;align-items:center;';
        row.innerHTML = `
          <input type="text" class="field-input" style="flex:1;" value="${escapeHtml(b)}" data-board-input="${idx}" />
          <button class="quick-add" data-delete="${idx}" style="color:var(--danger);border-color:rgba(248,113,113,0.25);">${ICONS.x}</button>
        `;
        list.appendChild(row);
      });

      list.querySelectorAll('[data-board-input]').forEach(inp => {
        inp.onchange = () => {
          const idx = parseInt(inp.dataset.boardInput);
          const oldName = state.boards[idx];
          const newName = inp.value.trim();
          if (!newName || newName === oldName) return;
          state.boards[idx] = newName;
          state.games.forEach(g => { if (g.board === oldName) g.board = newName; });
          save();
        };
      });

      list.querySelectorAll('[data-delete]').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.delete);
          const name = state.boards[idx];
          const used = state.games.filter(g => g.board === name).length;
          const msg = used > 0
            ? `Delete "${name}"?\n\n${used} game(s) reference this board. They'll show as "No board".`
            : `Delete "${name}"?`;
          if (!confirm(msg)) return;
          state.boards.splice(idx, 1);
          state.games.forEach(g => { if (g.board === name) g.board = null; });
          save();
          renderBoardList();
        };
      });
    }

    renderBoardList();

    document.getElementById('addBoardBtn').onclick = () => {
      const name = prompt('Board name:');
      if (!name || !name.trim()) return;
      const trimmed = name.trim();
      if (state.boards.includes(trimmed)) { toast('That board already exists'); return; }
      state.boards.push(trimmed);
      save();
      renderBoardList();
    };

    document.getElementById('backBtn').onclick = () => {
      closeSheet();
      setTimeout(openSettingsSheet, 120);
    };
  });
}

/* ============================================================
   SHEET PLUMBING
   ============================================================ */
let sheetCleanup = null;

function openSheet(html, onReady) {
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = html;
  document.getElementById('backdrop').classList.add('show');
  sheet.classList.add('show');
  sheet.scrollTop = 0;
  if (typeof onReady === 'function') setTimeout(onReady, 60);
  sheetCleanup = () => {
    document.getElementById('backdrop').classList.remove('show');
    sheet.classList.remove('show');
  };
}
function closeSheet() { if (sheetCleanup) sheetCleanup(); }

document.getElementById('backdrop').addEventListener('click', closeSheet);

/* ============================================================
   WELCOME SCREEN
   ============================================================ */
function showWelcome(force = false) {
  const welcome = document.getElementById('welcome');
  if (!welcome) return;
  const seen = localStorage.getItem(WELCOME_KEY);
  if (seen && !force) {
    welcome.classList.add('hidden');
    return;
  }
  welcome.classList.remove('hidden');
  updateWelcomeCountdownText();
}

function dismissWelcome() {
  const welcome = document.getElementById('welcome');
  welcome.classList.add('hidden');
  try { localStorage.setItem(WELCOME_KEY, '1'); } catch {}
}

document.getElementById('welcomeBtn').addEventListener('click', dismissWelcome);

/* ============================================================
   RENDER ROOT
   ============================================================ */
function render() {
  const scrollY = window.scrollY;
  if (state.view === 'home') renderHome();
  else if (state.view === 'history') renderHistory();
  else if (state.view === 'stats') renderStats();
  window.scrollTo(0, scrollY);
  tickCountdowns();
}

/* ============================================================
   INIT
   ============================================================ */
load();
showWelcome();
render();
</script>
